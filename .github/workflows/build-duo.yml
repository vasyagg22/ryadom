name: Build two offline AIs (Android APK)
on:
  push:
    branches: [build/duo-offline-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'false'
      PLUS_STORE_GATE: '0'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python Pillow
        run: python3 -m pip install --break-system-packages Pillow
      - name: Get PocketPal AI MIT v1.24.0 sources
        run: git clone --depth 1 --branch v1.24.0 https://github.com/a-ghorbani/pocketpal-ai.git pocketpal
      - name: Apply custom Android package, design and branding
        run: python3 scripts/patch_upstream.py
      - name: Install Yarn and source dependencies
        working-directory: pocketpal
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Install SDK platform and native compiler
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"; fi
      - name: Build arm64 release APK (debug-signed beta)
        working-directory: pocketpal/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleProdRelease
      - name: Verify actual Android APK package and signature
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find pocketpal/android/app/build/outputs/apk/prod/release -name '*.apk' -type f | head -n1)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" out/Dva-II-offline-v0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose out/Dva-II-offline-v0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs out/Dva-II-offline-v0.1.0-arm64.apk > out/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging out/Dva-II-offline-v0.1.0-arm64.apk > out/badging.txt
          grep "package: name='app.duo.offlineai'" out/badging.txt
          cd out && sha256sum Dva-II-offline-v0.1.0-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Dva-II-Android-0.1.0-beta
          path: out/*
          if-no-files-found: error
          retention-days: 30
